<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monopoly Loan Tracker</title>
<style>
    body {
        font-family: 'Segoe UI', sans-serif;
        background: radial-gradient(circle at top, #1b5e20, #0d3b12);
        color: #fff;
        margin: 0;
        padding: 40px;
    }

    h1 {
        text-align: center;
        letter-spacing: 2px;
        margin-bottom: 30px;
    }

    /* 🔐 Password box */
    .auth-box {
        position: fixed;
        top: 15px;
        right: 20px;
        background: #00000088;
        padding: 10px 14px;
        border-radius: 14px;
        display: flex;
        gap: 6px;
        align-items: center;
        backdrop-filter: blur(6px);
    }

    .auth-box input {
        width: 140px;
        padding: 6px 8px;
        border-radius: 10px;
        border: none;
        outline: none;
        font-size: 13px;
    }

    .auth-box button {
        padding: 6px 10px;
        border-radius: 12px;
        background: linear-gradient(135deg, #ffd700, #ffb300);
        border: none;
        font-weight: bold;
        cursor: pointer;
    }

    .auth-ok {
        color: #7CFC00;
        font-weight: bold;
        margin-left: 6px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: #ffffff10;
        backdrop-filter: blur(6px);
        border-radius: 10px;
        overflow: hidden;
    }

    th, td {
        padding: 14px;
        text-align: center;
    }

    th {
        background: #00000055;
        font-weight: 600;
    }

    tr:nth-child(even) {
        background: #ffffff08;
    }

    input {
        width: 90%;
        padding: 8px;
        border-radius: 6px;
        border: none;
        outline: none;
        font-size: 14px;
    }

    button {
        background: linear-gradient(135deg, #ffd700, #ffb300);
        border: none;
        padding: 8px 14px;
        border-radius: 18px;
        font-weight: bold;
        cursor: pointer;
    }

    .locked { opacity: 0.6; pointer-events: none; }
    .controls { margin-top: 30px; text-align: center; }

    .low { color: #7CFC00; }
    .mid { color: #FFD700; }
    .high { color: #FF4C4C; }

    .paid { text-decoration: line-through; opacity: 0.5; }
</style>
</head>
<body>

<!-- 🔐 AUTH BOX -->
<div class="auth-box">
    <input type="password" id="pw" placeholder="Banker Password">
    <button onclick="unlock()">Unlock</button>
    <span id="authStatus"></span>
</div>

<h1>🏦 MONOPOLY BANK LOAN TRACKER</h1>

<table id="loanTable">
    <thead>
        <tr>
            <th>Borrower</th>
            <th>Loan Amount</th>
            <th>Interest / 10 min (%)</th>
            <th>Elapsed Time</th>
            <th>Amount Owed</th>
            <th>Enter</th>
            <th>Paid</th>
            <th>Remove</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<div class="controls">
    <button onclick="addLoanRow()">➕ Add Another Loan</button>
</div>

<script>
let isUnlocked = false;
const PASSWORD = "CoolBanker25!";

function unlock() {
    const input = document.getElementById("pw");
    if (input.value === PASSWORD) {
        isUnlocked = true;
        document.getElementById("authStatus").textContent = "✓";
        document.getElementById("authStatus").className = "auth-ok";
        input.value = "";
    } else {
        alert("Incorrect password");
    }
}

let loans = JSON.parse(localStorage.getItem("monopolyLoans")) || [];

function saveLoans() {
    localStorage.setItem("monopolyLoans", JSON.stringify(loans));
}

function uid() {
    return crypto.randomUUID();
}

function addLoanRow(data = null) {
    const tbody = document.querySelector("#loanTable tbody");
    const row = document.createElement("tr");

    row.innerHTML = `
        <td><input placeholder="Name"></td>
        <td><input type="number" placeholder="$"></td>
        <td><input type="number" step="0.01" placeholder="%"></td>
        <td class="time">00:00</td>
        <td class="owed">$0.00</td>
        <td><button>ENTER</button></td>
        <td><button>✔</button></td>
        <td><button>🗑</button></td>
    `;

    const inputs = row.querySelectorAll("input");
    const [enterBtn, paidBtn, removeBtn] = row.querySelectorAll("button");

    let loanId = data?.id || null;

    enterBtn.onclick = () => {
        if (!isUnlocked || loanId) return;

        const name = inputs[0].value.trim();
        const principal = parseFloat(inputs[1].value);
        const interest = parseFloat(inputs[2].value) / 100;

        if (!name || isNaN(principal) || isNaN(interest)) {
            alert("Fill out all fields!");
            return;
        }

        loanId = uid();
        inputs.forEach(i => i.classList.add("locked"));

        loans.push({
            id: loanId,
            name,
            principal,
            interest,
            startTime: Date.now(),
            paid: false
        });

        saveLoans();
    };

    paidBtn.onclick = () => {
        if (!isUnlocked) return;
        const loan = loans.find(l => l.id === loanId);
        if (!loan) return;
        loan.paid = true;
        row.classList.add("paid");
        saveLoans();
    };

    removeBtn.onclick = () => {
        if (!isUnlocked) return;
        tbody.removeChild(row);
        loans = loans.filter(l => l.id !== loanId);
        saveLoans();
    };

    if (data) {
        loanId = data.id;
        inputs[0].value = data.name;
        inputs[1].value = data.principal;
        inputs[2].value = data.interest * 100;
        inputs.forEach(i => i.classList.add("locked"));
        if (data.paid) row.classList.add("paid");
    }

    tbody.appendChild(row);
}

setInterval(() => {
    const now = Date.now();
    loans.forEach(loan => {
        if (loan.paid) return;

        const minutes = (now - loan.startTime) / 60000;
        const periods = minutes / 10;
        const owed = loan.principal * Math.pow(1 + loan.interest, periods);

        const row = [...document.querySelectorAll("#loanTable tbody tr")]
            .find(r => r.querySelector("input")?.value === loan.name);

        if (!row) return;

        row.querySelector(".owed").textContent = "$" + owed.toFixed(2);
        row.querySelector(".time").textContent =
            `${Math.floor(minutes)}:${Math.floor((minutes % 1) * 60).toString().padStart(2,"0")}`;
    });
}, 1000);

const saved = [...loans];
loans = [];
saved.forEach(l => {
    addLoanRow(l);
    loans.push(l);
});

if (saved.length === 0) addLoanRow();
</script>

</body>
</html>
