<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monopoly Loan Tracker</title>
<style>
    body {
        font-family: 'Segoe UI', sans-serif;
        background: radial-gradient(circle at top, #1b5e20, #0d3b12);
        color: #fff;
        margin: 0;
        padding: 40px;
    }

    h1 {
        text-align: center;
        letter-spacing: 2px;
        margin-bottom: 30px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: #ffffff10;
        backdrop-filter: blur(6px);
        border-radius: 10px;
        overflow: hidden;
    }

    th, td {
        padding: 14px;
        text-align: center;
    }

    th {
        background: #00000055;
        font-weight: 600;
    }

    tr:nth-child(even) {
        background: #ffffff08;
    }

    input {
        width: 90%;
        padding: 8px;
        border-radius: 6px;
        border: none;
        outline: none;
        font-size: 14px;
    }

    button {
        background: linear-gradient(135deg, #ffd700, #ffb300);
        border: none;
        padding: 10px 18px;
        border-radius: 20px;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.15s, box-shadow 0.15s;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(0,0,0,0.3);
    }

    .locked {
        opacity: 0.6;
        pointer-events: none;
    }

    .controls {
        margin-top: 30px;
        text-align: center;
    }

    .low { color: #7CFC00; }
    .mid { color: #FFD700; }
    .high { color: #FF4C4C; }

    .paid {
        text-decoration: line-through;
        opacity: 0.5;
    }
</style>
</head>
<body>

<h1>🏦 MONOPOLY BANK LOAN TRACKER</h1>

<table id="loanTable">
    <thead>
        <tr>
            <th>Borrower</th>
            <th>Loan Amount</th>
            <th>Interest / 10 min (%)</th>
            <th>Elapsed Time</th>
            <th>Amount Owed</th>
            <th>Enter</th>
            <th>Paid</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<div class="controls">
    <button onclick="addLoanRow()">➕ Add Another Loan</button>
</div>

<script>
let loans = JSON.parse(localStorage.getItem("monopolyLoans")) || [];

function saveLoans() {
    localStorage.setItem("monopolyLoans", JSON.stringify(loans));
}

function addLoanRow(data = null) {
    const tbody = document.querySelector("#loanTable tbody");
    const row = document.createElement("tr");

    row.innerHTML = `
        <td><input placeholder="Name"></td>
        <td><input type="number" placeholder="$"></td>
        <td><input type="number" step="0.01" placeholder="%"></td>
        <td class="time">00:00</td>
        <td class="owed">$0.00</td>
        <td><button>ENTER</button></td>
        <td><button>✔</button></td>
    `;

    const inputs = row.querySelectorAll("input");
    const enterBtn = row.querySelectorAll("button")[0];
    const paidBtn = row.querySelectorAll("button")[1];

    if (data) {
        inputs[0].value = data.name;
        inputs[1].value = data.principal;
        inputs[2].value = data.interest * 100;
        startLoan(row, data.startTime, data.paid);
        if (data.paid) markPaid(row);
    }

    enterBtn.onclick = () => startLoan(row);
    paidBtn.onclick = () => markPaid(row);

    tbody.appendChild(row);
}

function startLoan(row, forcedStart = null, isPaid = false) {
    const inputs = row.querySelectorAll("input");
    const name = inputs[0].value.trim();
    const principal = parseFloat(inputs[1].value);
    const interest = parseFloat(inputs[2].value) / 100;

    if (!name || isNaN(principal) || isNaN(interest)) {
        alert("Fill out all fields!");
        return;
    }

    inputs.forEach(i => i.classList.add("locked"));

    const loan = {
        name,
        principal,
        interest,
        startTime: forcedStart || Date.now(),
        paid: isPaid,
        row
    };

    loans.push(loan);
    saveLoans();
}

function markPaid(row) {
    row.classList.add("paid");
    loans.forEach(l => {
        if (l.row === row) l.paid = true;
    });
    saveLoans();
}

setInterval(() => {
    const now = Date.now();

    loans.forEach(loan => {
        if (loan.paid) return;

        const minutes = (now - loan.startTime) / 60000;
        const periods = minutes / 10;
        const owed = loan.principal * Math.pow(1 + loan.interest, periods);

        const owedCell = loan.row.querySelector(".owed");
        const timeCell = loan.row.querySelector(".time");

        owedCell.textContent = "$" + owed.toFixed(2);

        owedCell.className = "owed " +
            (owed < loan.principal * 1.5 ? "low" :
             owed < loan.principal * 3 ? "mid" : "high");

        const mins = Math.floor(minutes);
        const secs = Math.floor((minutes % 1) * 60);
        timeCell.textContent = `${mins}:${secs.toString().padStart(2, "0")}`;
    });
}, 1000);

// restore saved loans
loans.forEach(l => addLoanRow(l));

// start with one if empty
if (loans.length === 0) addLoanRow();
</script>

</body>
</html>
