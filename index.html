<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Monopoly Loan Tracker</title>

    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2c2c54);
            color: #f1f1f1;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #111827;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0,0,0,0.4);
        }

        thead {
            background: #0f172a;
        }

        th, td {
            padding: 14px;
            text-align: center;
        }

        th {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            color: #93c5fd;
        }

        tbody tr:nth-child(even) {
            background: #020617;
        }

        input {
            width: 95%;
            padding: 6px;
            border-radius: 6px;
            border: none;
            text-align: center;
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 5px #60a5fa;
        }

        .owe {
            font-weight: bold;
            color: #facc15;
        }

        .time {
            color: #a5b4fc;
            font-size: 0.9rem;
        }

        button {
            margin-top: 20px;
            display: block;
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #022c22;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34,197,94,0.4);
        }

        footer {
            text-align: center;
            margin-top: 15px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>

<h1>🏦 Monopoly Bank Loan Tracker</h1>

<table>
    <thead>
        <tr>
            <th>Player Name</th>
            <th>Loan Amount ($)</th>
            <th>Interest / 10 min ($)</th>
            <th>Time Elapsed</th>
            <th>Currently Owed ($)</th>
        </tr>
    </thead>
    <tbody id="loanTable"></tbody>
</table>

<button onclick="addLoan()">➕ Add New Loan</button>

<footer>
    Interest compounds every 10 minutes • Monopoly rules apply
</footer>

<script>
    const loans = [];

    function addLoan() {
        const loan = {
            name: "",
            principal: 0,
            interest: 0,
            startTime: Date.now()
        };

        loans.push(loan);
        render();
    }

    function render() {
        const table = document.getElementById("loanTable");
        table.innerHTML = "";

        loans.forEach((loan, index) => {
            const row = document.createElement("tr");

            row.innerHTML = `
                <td>
                    <input placeholder="Player" 
                        oninput="loans[${index}].name = this.value">
                </td>
                <td>
                    <input type="number" min="0" 
                        oninput="loans[${index}].principal = Number(this.value)">
                </td>
                <td>
                    <input type="number" min="0" 
                        oninput="loans[${index}].interest = Number(this.value)">
                </td>
                <td class="time" id="time-${index}">0 min</td>
                <td class="owe" id="owe-${index}">$0</td>
            `;

            table.appendChild(row);
        });
    }

    function updateLoans() {
        loans.forEach((loan, index) => {
            const elapsedMs = Date.now() - loan.startTime;
            const elapsedMin = Math.floor(elapsedMs / 60000);
            const intervals = Math.floor(elapsedMin / 10);

            const owed = loan.principal + (intervals * loan.interest);

            const timeCell = document.getElementById(`time-${index}`);
            const oweCell = document.getElementById(`owe-${index}`);

            if (timeCell) timeCell.textContent = `${elapsedMin} min`;
            if (oweCell) oweCell.textContent = `$${owed.toFixed(2)}`;
        });
    }

    setInterval(updateLoans, 60000);
</script>

</body>
</html>
